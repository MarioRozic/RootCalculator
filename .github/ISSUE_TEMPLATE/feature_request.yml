name: Feature request
description: Suggest an idea or improvement for the app
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature or change.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: How would it make your games easier or more fun?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, screenshots, or examples from other apps.
