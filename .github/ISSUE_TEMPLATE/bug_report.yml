name: Bug report
description: Something in the app doesn't work or shows the wrong result
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this! A few details help a lot.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, and what you expected to happen instead.
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Where in the app?
      options:
        - Picking factions
        - Map and suits
        - Turn order and setup
        - Scoring during the game
        - Stats and end of game
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: Factions, player count and the steps you took, if relevant.
      placeholder: |
        1. Start a 4 player game with ...
        2. Tap ...
        3. See ...
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari / Windows, Chrome
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here if you have any.
